pcm.!surround21 { hint.show off }
pcm.!sysdefault { hint.show off }

pcm.!default {
    type plug
    slave.pcm {
        type multi
        slaves.dac.pcm "SJ_SOUNDCARD"
        slaves.dac.channels 2
        slaves.led.pcm {
            type plug
            slave {
                pcm "hw:CARD=Loopback,DEV=0,SUBDEV=0"
                rate 44100
                format S16_LE
                channels 1
            }
        }
        slaves.led.channels 1
        bindings.0.slave "dac"
        bindings.0.channel 0
        bindings.1.slave "dac"
        bindings.1.channel 1
        bindings.2.slave "led"
        bindings.2.channel 0
    }
    slave.channels 3
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 0.5
    ttable.1.2 0.5
}
pcm.ledfx {
    type plug
    slave {
        pcm "hw:CARD=Loopback,DEV=1,SUBDEV=0"
        rate 44100
        format S16_LE
        channels 1
    }
